name: Word5
summary: A daily word puzzle with private Amber-encrypted saves
description: |
  A native daily five-letter word puzzle: six tries, a new puzzle at midnight UTC,
  hard mode, statistics and a shareable result grid. Play offline. Sign in only
  with Amber to automatically restore and back up your statistics, completed
  outcomes and unfinished game with NIP-44 encryption. Private saves stay private;
  sharing a result is an explicit action. Remember Amber permissions for automatic
  synchronization. Older completed games retain outcomes rather than exact guesses.
